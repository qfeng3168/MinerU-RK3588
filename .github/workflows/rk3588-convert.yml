name: rk3588-convert

# Convert one MinerU pipeline ONNX model to RKNN on an x86_64 runner
# (rknn-toolkit2 is x86-only; the RK3588 board never converts or compiles).
# Converted artifacts are kept as workflow artifacts until the HF model repo
# is ready to receive them; the conversion report is committed to the
# ci-results branch like the other RK3588 CI checks.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Registry model key"
        type: choice
        required: true
        options:
          - ocr_det
          - ocr_rec
          - seal_det
          - pp_doclayout_v2
          - pp_formulanet_plus_m
          - slanet_plus
          - unet_structure
          - paddle_table_cls

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion toolchain
        run: |
          set -o pipefail
          {
            pip install --upgrade pip
            pip install rknn-toolkit2==2.3.2 "onnx==1.16.1" huggingface_hub numpy
          } 2>&1 | tee /tmp/install.log

      - name: Convert ${{ inputs.model }} to RKNN
        run: |
          set -o pipefail
          python tools/rk3588/convert.py "${{ inputs.model }}" --out-dir build/rknn 2>&1 | tee /tmp/convert.log

      - name: Upload converted artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rknn-${{ inputs.model }}-${{ github.run_id }}
          path: build/rknn/
          retention-days: 90

      - name: Upload to Hugging Face
        if: ${{ secrets.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import HfApi

          api = HfApi()
          report = json.loads(Path("build/rknn/report.json").read_text())
          repo = report["hf_repo"]
          out_dir = Path("build/rknn")
          uploads = [(out_dir / report["rknn_file"], report["hf_rknn_path"])]
          uploads.append((out_dir / (report["rknn_file"] + ".inputs.json"), report["hf_rknn_path"] + ".inputs.json"))
          if report.get("hf_config_path"):
              uploads.append((out_dir / Path(report["hf_config_path"]).name, report["hf_config_path"]))
          for local, dest in uploads:
              api.upload_file(
                  path_or_fileobj=str(local),
                  path_in_repo=dest,
                  repo_id=repo,
                  repo_type="model",
                  commit_message=f"add {report['model']} rknn (run ${{ github.run_id }})",
              )
              print(f"uploaded {dest}")
          PY

      - name: Publish report to ci-results branch
        if: always()
        run: |
          {
            echo "# RKNN conversion — ${{ inputs.model }} (run ${{ github.run_id }})"
            echo
            echo '```json'
            cat build/rknn/report.json 2>/dev/null || echo '{"status": "conversion failed before report"}'
            echo '```'
            echo
            echo "## conversion log (tail)"
            echo '```'
            tail -n 120 /tmp/convert.log 2>/dev/null || echo "(no convert log)"
            echo '```'
          } > /tmp/convert-report.md
          git config user.name "rk3588-ci"
          git config user.email "ci@invalid"
          git fetch origin ci-results || true
          git checkout ci-results 2>/dev/null || git checkout --orphan ci-results
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results/convert/${{ inputs.model }}/${{ github.run_id }}
          cp /tmp/convert-report.md results/convert/${{ inputs.model }}/${{ github.run_id }}/report.md
          git add results/
          git commit -m "convert report ${{ inputs.model }} ${{ github.run_id }}"
          git push origin ci-results
